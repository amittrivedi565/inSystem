
<div class="border bg-white">

    <!-- Form Header -->
    <div class="px-4 py-3 border-bottom">
        <h6 class="fw-semibold mb-1">Employee Information</h6>
        <p class="text-muted small mb-0">
            Enter the basic details of the employee.
        </p>
    </div>

    <!-- Form Body -->
    <form #form="ngForm"
          (ngSubmit)="onSubmit.emit(form.value)">

        <div class="p-4">

            <div class="row g-4">

                @for (field of fields(); track field.name) {
                    <div class="col-md-6">

                        <label
                            [for]="field.name"
                            class="form-label small fw-semibold mb-2">

                            {{ field.label }}

                            @if (field.required) {
                                <span class="text-danger">*</span>
                            }

                        </label>

                        <input
                            [id]="field.name"
                            [type]="field.type"
                            [name]="field.name"
                            class="form-control form-control-sm"
                            [placeholder]="field.placeholder || ''"
                            [required]="field.required || false"
                            ngModel
                        />

                    </div>
                }

            </div>

        </div>

        <!-- Form Footer -->
        <div class="px-4 py-3 border-top bg-light d-flex justify-content-end gap-2">

            <button
                type="reset"
                class="btn btn-light border btn-sm px-3">
                Cancel
            </button>

            <button
                type="submit"
                class="btn btn-primary btn-sm px-4">
                {{ submitLabel() }}
            </button>

        </div>

    </form>

</div>
