
<nav class="navbar navbar-expand-lg navbar-dark px-2 px-md-3"
    style="background-color: #312d2a;">

    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand me-4" routerLink="/">
            <b>{{ brand.slice(0, 2) }}</b>{{ brand.slice(2) }}
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler shadow-none" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- Navigation -->
            <ul class="navbar-nav mx-auto my-2 my-lg-0 gap-lg-2">

                @for (item of navItems; track item.route) {
                    <li class="nav-item">
                        <a class="nav-link text-light"
                            [routerLink]="item.route"
                            routerLinkActive="active">
                            {{ item.label }}
                        </a>
                    </li>
                }

            </ul>

            <!-- Profile -->
            <div class="dropdown pt-3 mt-2 pt-lg-0 mt-lg-0">

                <button class="btn text-light dropdown-toggle d-flex
                    align-items-center gap-2 p-0"
                    type="button" data-bs-toggle="dropdown">

                    <span class="rounded-circle bg-secondary d-flex
                        align-items-center justify-content-center"
                        style="width: 34px; height: 34px;">

                        <i class="bi bi-person-fill"></i>
                    </span>

                    <span class="small fw-semibold">{{ userName }}</span>

                </button>

                <ul class="dropdown-menu dropdown-menu-end rounded-2 shadow-sm">

                    @for (item of profileMenu; track item.label) {
                        <li>
                            <a class="dropdown-item"
                                [class.text-danger]="item.danger"
                                [routerLink]="item.route">

                                <i class="bi {{ item.icon }} me-2"></i>
                                {{ item.label }}

                            </a>
                        </li>
                    }

                </ul>

            </div>

        </div>
    </div>
</nav>
