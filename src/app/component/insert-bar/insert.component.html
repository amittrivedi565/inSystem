
<div class="insert-bar mt-5 mb-2">

    <!-- Left Section -->
    <div class="insert-bar-content">

        <div class="insert-bar-title">
            {{ Title() }}
        </div>

        <p class="insert-bar-subtitle">
            {{ SubTitle() }}
        </p>

    </div>

    <!-- Right Actions -->
    <div class="insert-bar-actions">

        <button type="button"
                class="insert-action-btn"
                aria-label="Create new">

            <i class="bi bi-plus-lg"></i>
            <span>Create New</span>

        </button>

    </div>

</div>
