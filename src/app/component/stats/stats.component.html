<div class="row g-4 mt-2">

    @for (stat of stats; track stat.id) {

        <div class="col-12 col-sm-6 col-lg-3">

            <div class="position-relative d-flex flex-column bg-white border p-4 text-center h-100">

                <!-- Top Right Actions -->
                <div class="position-absolute top-0 end-0 d-flex gap-3 p-2">
                    <a href="#" class="text-dark">
                        <i class="bi bi-box-arrow-up-right"></i>
                    </a>
                    <a href="#" class="text-dark">
                        <i class="bi bi-three-dots-vertical"></i>
                    </a>
                </div>

                <h1 class="display-4 fw-bold mb-0 mt-3">
                    {{ stat.value }}
                </h1>

                <p class="text-secondary fs-5 mb-2">
                    {{ stat.title }}
                </p>

                <!-- Sparkline -->
                <svg viewBox="0 0 250 35" width="100%" height="35"
                     preserveAspectRatio="none">

                    <polyline
                        points="0,20 10,22 20,18 30,21 40,19 50,22 60,18 70,20 80,12 90,20 100,19 110,22 120,18 130,20 140,5 150,25 160,17 170,20 180,14 190,21 200,18 210,23 220,15 230,20 240,12 250,20"
                        fill="none"
                        stroke="#527c89"
                        stroke-width="1.3"
                        stroke-linecap="round"
                        stroke-linejoin="round" />

                </svg>

            </div>

        </div>

    }

</div>
