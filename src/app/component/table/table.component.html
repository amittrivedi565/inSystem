<table class="table table-hover table-sm mt-5 border">
    <thead class="border-bottom">
        <tr>
            <th class="p-3">Operations</th>
            @for (cols of tableData.tHead; track cols.field) {
            <th class="p-3">{{cols.header}}</th>
            }
        </tr>
    </thead>

    <tbody>
        @for (rows of tableData.tRows; track rows.id) {
        <tr>
            <td class="p-3">
                <div class="dropdown">
                    <button class="btn btn-sm border-0 text-dark p-1" type="button" data-bs-toggle="dropdown">
                        ⋮
                    </button>

                    <ul class="dropdown-menu dropdown-menu-sm rounded-0 shadow-sm py-1">
                        <li>
                            <a href="/employees/edit/1" class="dropdown-item small py-1">
                                Edit
                            </a>
                        </li>
                        <li>
                            <button class="dropdown-item text-danger small py-1" type="button">
                                Delete
                            </button>
                        </li>
                    </ul>
                </div>
            </td>
            @for (item of tableData.tHead; track item.field) {
                <td class="align-middle">{{$any(rows)[item.field]}}</td>
            }
        </tr>
        }
    </tbody>
</table>
